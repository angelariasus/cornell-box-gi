<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Illumination Viewer · Cornell Box</title>
    <meta
      name="description"
      content="Interactive WebGL2 viewer that renders the Cornell box with Phong, Whitted ray tracing, path tracing and radiosity, so the four methods can be compared on the same scene."
    />
    <meta name="author" content="angelariasus" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#151517" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews. og:url, og:image and the canonical link are added at build time once the
         site address is known (see vite.config.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cornell Box GI" />
    <meta property="og:title" content="Cornell Box GI · Global Illumination Viewer" />
    <meta
      property="og:description"
      content="Phong, Whitted ray tracing, path tracing and radiosity on the Cornell box, rendered in real time in the browser."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Cornell box rendered with Phong, radiosity and path tracing"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
